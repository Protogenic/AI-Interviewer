version: '3.9'

services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ai_interviewer
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  backend-api:
    build: ./backend-api
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./backend-api/.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ai_interviewer
      AI_SERVICE_URL: http://ai-service:8000
      TTS_SERVICE_URL: http://tts-service:8100
      PORT_REST: 3001
      PORT_WS: 3002
    ports:
      - '3001:3001'
      - '3002:3002'
    command: >
      sh -c "./node_modules/.bin/prisma migrate deploy && ./node_modules/.bin/tsx prisma/seed.ts && node dist/server.js"

  ai-service:
    build:
      context: .
      dockerfile: ai_service_api/Dockerfile
    environment:
      - PYTHONUNBUFFERED=1
    env_file:
      - ./ai_service_api/ai_service/.env
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '8000:8000'

 
  stt-service:
    build:
      context: .
      dockerfile: stt_service/Dockerfile
    environment:
      - PYTHONUNBUFFERED=1
      - WHISPER_MODEL=base
      - WHISPER_COMPUTE_TYPE=int8
      - WHISPER_VAD_FILTER=false
      - HF_TOKEN=${HF_TOKEN:-}
      - HF_HOME=/cache/huggingface
    volumes:
      - stt_hf_cache:/cache/huggingface
    ports:
      - '8010:8010'

  tts-service:
    build:
      context: ./tts_service
      dockerfile: Dockerfile
    environment:
      - PYTHONUNBUFFERED=1
      - ENGINE=dummy
    ports:
      - '8100:8100'

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:3001/api
        VITE_WS_URL: http://localhost:3002
        VITE_STT_URL: http://localhost:8010
    ports:
      - '5173:80'
    depends_on:
      - backend-api
      - stt-service

volumes:
  postgres_data:
  stt_hf_cache:
