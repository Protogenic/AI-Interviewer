version: '3.9'

services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ai_interviewer
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  backend-api:
    build: ./backend-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ai_interviewer
      AI_SERVICE_URL: http://ai-service:8000
      PORT_REST: 3001
      PORT_WS: 3002
    ports:
      - '3001:3001'
      - '3002:3002'
    command: >
      sh -c "npx prisma migrate deploy && npx prisma db seed && node dist/server.js"

  ai-service:
    build: ./ai_service_api
    ports:
      - '8000:8000'

  frontend:
    build: ./frontend
    ports:
      - '5173:80'
    depends_on:
      - backend-api

volumes:
  postgres_data:
