[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-interviewer-service"
version = "0.1.0"
description = "AI service for generating interview questions and parsing style profiles"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "pytest>=8.3",
    "pytest-asyncio",
    "openai",
    "chromadb",
    "sentence-transformers",
    "huggingface-hub",
    "numpy",
]